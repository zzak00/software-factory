version: 1
sources:
  - repository: "https://github.com/mattpocock/skills"
    revision: "3cca18b368ae95cdbdebbff572ccafa662551015"
    license: "MIT"
    notice: "LICENSE (Third-party notices)"
    skills:
      - name: "domain-modeling"
        upstream_path: "skills/engineering/domain-modeling"
        local_path: "skills/domain-modeling"
        patches:
          - "Keep provisional terminology in planning instead of a required root glossary."
          - "Make CONTEXT.md optional and require approval before durable writes."
      - name: "to-tickets"
        upstream_path: "skills/engineering/to-tickets"
        local_path: "skills/to-tickets"
        patches:
          - "Remove setup-skill, tracker, session, worktree, pull-request, and publication assumptions."
          - "Add source-coverage and dependency-graph validation before approval."
          - "Return tracker-neutral draft work items with caller-provided sizing."
  - repository: "https://github.com/mattpocock/skills"
    revision: "5beb35b040e3de97e54fa9e386d7e42d15c295c2"
    license: "MIT"
    notice: "LICENSE (Third-party notices)"
    skills:
      - name: "grilling"
        upstream_path: "skills/productivity/grilling"
        local_path: "skills/grilling"
        patches:
          - "Invoke only on request."
          - "Look facts up read-only, with at most one read-only sub-agent for slow lookups."
          - "Close with a numbered list of settled decisions for to-spec."
      - name: "to-spec"
        upstream_path: "skills/engineering/to-spec"
        local_path: "skills/to-spec"
        patches:
          - "Return the spec for the operator to file instead of publishing it; remove the triage label and setup-skill dependency."
          - "Replace the long user-story list with numbered acceptance criteria (issue) or requirements (product spec)."
          - "Add validation seams, Risk, Track, a Claude Design reference, and a Plannotator approval gate."
      - name: "implement"
        upstream_path: "skills/engineering/implement"
        local_path: "skills/implement"
        patches:
          - "Read the issue and the approved plan without tracker setup; require the item's Worktrunk worktree."
          - "Route bug issues and unexpected failures through diagnosing-bugs and send plan deviations back for approval."
          - "Return evidence per acceptance criterion, including UI screenshots, instead of committing; hand the diff to code-review."
      - name: "tdd"
        upstream_path: "skills/engineering/tdd"
        local_path: "skills/tdd"
        patches:
          - "Take seams from the issue and the approved plan; propose any other seam before testing at it."
          - "Replace GLOSSARY.md and codebase-design with the repository's domain terms, ADRs, and a stop back to the plan."
      - name: "diagnosing-bugs"
        upstream_path: "skills/engineering/diagnosing-bugs"
        local_path: "skills/diagnosing-bugs"
        patches:
          - "Add when-to-use triggers: triaged bug issues and unexpected failures whose cause isn't obvious."
          - "Start the feedback loop from the user's experience; read CLAUDE.md or AGENTS.md and ADRs instead of GLOSSARY.md."
          - "Keep instrumentation out of production and report the confirmed cause instead of writing commit messages."
      - name: "code-review"
        upstream_path: "skills/engineering/code-review"
        local_path: "skills/code-review"
        patches:
          - "Run read-only, record the reviewed SHA, and fall back to sequential axes when sub-agents are unavailable."
          - "Take the spec from the linked issue and the approved plan; read CLAUDE.md, AGENTS.md, and linter config as standards."
          - "Cite AC or R numbers with file and line, report ACs without evidence, and suggest blast-radius for Elevated risk."
      - name: "pr"
        upstream_path: "skills/engineering/pr"
        local_path: "skills/pr"
        patches:
          - "Invoke only on request and return the body for the operator to file instead of creating the PR."
          - "Add Closes, Plan, AC evidence table, and Review sections; use the repository's domain terms."
      - name: "git-guardrails-claude-code"
        upstream_path: "skills/misc/git-guardrails-claude-code"
        local_path: "skills/git-guardrails-claude-code"
        patches:
          - "Rewrite the hook for the factory: block pushes to the default branch, force pushes, merges without --match-head-commit, and destructive commands; allow feature-branch pushes."
          - "Install at repository scope only, merge into existing settings, and verify with Claude Code-shaped input."
      - name: "writing-for-agents"
        upstream_path: "skills/productivity/writing-for-agents"
        local_path: "skills/writing-for-agents"
        patches:
          - "Invoke only on request."
          - "Add guidance for a repository's AGENTS.md, imported by CLAUDE.md, with a self-maintaining section."
  - repository: "https://github.com/cursor/plugins"
    revision: "99b609a72323b70204eab407c622f436e858e112"
    license: "MIT"
    notice: "LICENSE (Third-party notices)"
    skills:
      - name: "architect"
        upstream_path: "pstack/skills/architect"
        local_path: "skills/architect"
        patches:
          - "Replace the how, why, arena, and interrogate skills and the Cursor model rule with the agent drafting two candidates itself."
          - "Require a plan approved in Plannotator before any code; leave implementation to the implement skill."
          - "Fold the runner prompt into Phase B and state the principle-skill rules directly."
          - "Remove the arena synthesis section and wording from the rationale template."
      - name: "create-verification-skill"
        upstream_path: "pstack/skills/create-verification-skill"
        local_path: "skills/create-verification-skill"
        patches:
          - "Generate into .claude/skills/verify-<app>/ with an AGENTS.md pointer for Codex instead of .cursor/skills."
          - "Cover a Python backend with a web frontend and UI screenshots for Claude Design comparison; return files for the operator to commit."
  - repository: "https://github.com/ayghri/i-have-adhd"
    revision: "1ecea1993b7fce257ffbd686c070948b5e07eda6"
    license: "MIT"
    notice: "LICENSE (Third-party notices)"
    skills:
      - name: "focused-output"
        upstream_path: "skills/i-have-adhd"
        local_path: "skills/focused-output"
        patches:
          - "Rename and reframe the skill around readers who skim, without asserting medical traits."
          - "Lead with the outcome, keep agent-owned work with the agent, and ask the user to act only when required."
          - "Add a one-screen budget, one-line bullets, tables for comparisons, and a cold-reader rule."
          - "Report state only when it changes, give time estimates only when grounded, and label unconfirmed error causes."
          - "Keep the banned openers and closers, the pre-send deletions, and the first-and-last-line check."
  - repository: "https://github.com/backnotprop/plannotator"
    revision: "7bc60214f690d4db39dcaa5dcfd64abc8948330e"
    release: "v0.27.20"
    license: "MIT OR Apache-2.0"
    selected_license: "MIT"
    notice: "LICENSE (Third-party notices)"
    skills:
      - name: "plannotator-review"
        upstream_path: "apps/skills/core/plannotator-review"
        local_path: "skills/plannotator-review"
        patches:
          - "Gate pull requests: the reviewed head must equal the PR head with required checks passing."
          - "Accept explicit committed and working diff boundaries and stop when Plannotator cannot represent one exactly."
          - "Hash the patch and file manifest before and after review and reject any mismatch."
          - "Classify annotations with evidence and keep file, Git, issue, and PR changes outside the skill."
