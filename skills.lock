version: 1
sources:
  - repository: "https://github.com/mattpocock/skills"
    revision: "3cca18b368ae95cdbdebbff572ccafa662551015"
    license: "MIT"
    notice: "README.md#third-party-licenses"
    skills:
      - name: "grill-with-docs"
        upstream_path: "skills/engineering/grill-with-docs"
        local_path: "skills/grill-with-docs"
        patches:
          - "Replace the Claude-specific Skill tool call with harness-neutral dependency loading."
      - name: "grill-me"
        upstream_path: "skills/productivity/grill-me"
        local_path: "skills/grill-me"
        patches:
          - "Replace the Claude-specific Skill tool call with harness-neutral dependency loading."
      - name: "grilling"
        upstream_path: "skills/productivity/grilling"
        local_path: "skills/grilling"
        patches:
          - "Require explicit approval before sub-agent delegation."
      - name: "domain-modeling"
        upstream_path: "skills/engineering/domain-modeling"
        local_path: "skills/domain-modeling"
        patches:
          - "Keep provisional terminology in planning instead of a required root glossary."
          - "Make CONTEXT.md optional and require approval before durable writes."
      - name: "to-spec"
        upstream_path: "skills/engineering/to-spec"
        local_path: "skills/to-spec"
        patches:
          - "Remove the fixed specification template and setup-skill and root-glossary assumptions."
          - "Replace automatic tracker publication and triage labeling with separate human approval gates."
          - "Add disposable working-file and Plannotator review behavior."
      - name: "to-tickets"
        upstream_path: "skills/engineering/to-tickets"
        local_path: "skills/to-tickets"
        patches:
          - "Remove setup-skill, local-tracker, fixed-template, and automatic-label assumptions."
          - "Add source-coverage and dependency-graph validation before approval."
          - "Separate issue creation, Project status, native blockers, and optional parent relationships into human-approved gates."
      - name: "implement"
        upstream_path: "skills/engineering/implement"
        local_path: "skills/implement"
        patches:
          - "Add readiness, isolated-worktree, reproduction, complete-validation, evidence, and commit-approval gates."
          - "Require the claimed ticket to be In Progress after its isolated worktree is created."
          - "Move code review after the approved commit and require a separate manual invocation."
          - "Keep review, push, pull-request, and Project mutations outside the implementation skill."
          - "Preserve the original review fixed point across rework rounds instead of substituting the current round start."
          - "Refuse direct or delegated review from the writable implementation session after commit."
      - name: "tdd"
        upstream_path: "skills/engineering/tdd"
        local_path: "skills/tdd"
        patches:
          - "Focus on the fewest crucial behavior tests at already-approved seams."
          - "Remove CONTEXT.md and automatic codebase-design dependencies."
          - "Permit small behavior-preserving refactoring after each green test."
      - name: "code-review"
        upstream_path: "skills/engineering/code-review"
        local_path: "skills/code-review"
        patches:
          - "Replace automatic parallel sub-agents and tracker setup assumptions with one sequential review."
          - "Add correctness, security, finding-verification, and strict no-mutation boundaries."
          - "Add a user-invoked Plannotator gate and reusable-worktree rework packet."
          - "Infer the issue and original fixed point from unambiguous Git branch metadata with a fail-closed merge-base fallback."
          - "Keep requested product-scope decisions in the read-only review session and require an intent-update proposal before rework."
          - "Reject incomplete scope decisions instead of inventing unresolved product parameters."
          - "Bind Plannotator eligibility to the original fixed point, reviewed HEAD, and exact changed-file set, failing the human gate when its symbolic base narrows the diff."
  - repository: "https://github.com/backnotprop/plannotator"
    revision: "96313ab228ede843203d38d9d2a86e1c87e18c81"
    release: "v0.27.12"
    license: "MIT OR Apache-2.0"
    selected_license: "MIT"
    notice: "README.md#third-party-licenses"
    skills:
      - name: "plannotator-review"
        upstream_path: "apps/skills/core/plannotator-review"
        local_path: "skills/plannotator-review"
        patches:
          - "Keep the upstream terminal launch, wait, and same-conversation feedback behavior."
          - "Make the skill user-only and constrain it to the active read-only code-review boundary."
          - "Use the explicit Git provider and reject shell-escape execution that can strand feedback."
          - "Request one-time approval for only the privacy-restricted Plannotator process when a read-only sandbox blocks its local server and session metadata."
          - "Distinguish requested scope changes from defects, ask the product question in-session, and prepare an issue-intent update before rework."
          - "Continue asking when a scope answer does not yet define one testable expected behavior."
          - "Verify Plannotator's symbolic base and displayed file set before and after review, and reject any boundary mismatch including approval."
checkout_only_skills:
  - name: "setup-factory"
    local_path: "skills/setup-factory"
    reason: "Runs only from the portable checkout because it requires the adjacent setup script and operator guide."
