version: 1
sources:
  - repository: "https://github.com/mattpocock/skills"
    revision: "3cca18b368ae95cdbdebbff572ccafa662551015"
    license: "MIT"
    notice: "LICENSE (Third-party notices)"
    skills:
      - name: "grill-with-docs"
        upstream_path: "skills/engineering/grill-with-docs"
        local_path: "skills/grill-with-docs"
        patches:
          - "Replace the Claude-specific Skill tool call with harness-neutral dependency loading."
      - name: "grill-me"
        upstream_path: "skills/productivity/grill-me"
        local_path: "skills/grill-me"
        patches:
          - "Replace the Claude-specific Skill tool call with harness-neutral dependency loading."
      - name: "grilling"
        upstream_path: "skills/productivity/grilling"
        local_path: "skills/grilling"
        patches:
          - "Require explicit approval before sub-agent delegation."
      - name: "domain-modeling"
        upstream_path: "skills/engineering/domain-modeling"
        local_path: "skills/domain-modeling"
        patches:
          - "Keep provisional terminology in planning instead of a required root glossary."
          - "Make CONTEXT.md optional and require approval before durable writes."
      - name: "to-spec"
        upstream_path: "skills/engineering/to-spec"
        local_path: "skills/to-spec"
        patches:
          - "Remove the fixed specification template and setup-skill and root-glossary assumptions."
          - "Remove tracker publication, workflow state, and cross-skill coordination."
          - "Add concise disposable working-file and explicit Plannotator review behavior."
      - name: "to-tickets"
        upstream_path: "skills/engineering/to-tickets"
        local_path: "skills/to-tickets"
        patches:
          - "Remove setup-skill, tracker, session, worktree, pull-request, and publication assumptions."
          - "Add source-coverage and dependency-graph validation before approval."
          - "Return tracker-neutral draft work items with caller-provided sizing."
      - name: "implement"
        upstream_path: "skills/engineering/implement"
        local_path: "skills/implement"
        patches:
          - "Operate on approved behavior in the current checkout without tracker, branch, worktree, or session assumptions."
          - "Keep staging, commits, publication, review sequencing, and external mutations outside the skill."
          - "Return changed files, acceptance evidence, command results, uncertainty, and optional continuation context."
      - name: "tdd"
        upstream_path: "skills/engineering/tdd"
        local_path: "skills/tdd"
        patches:
          - "Focus on the fewest crucial behavior tests at already-approved seams."
          - "Remove CONTEXT.md and automatic codebase-design dependencies."
          - "Permit small behavior-preserving refactoring after each green test."
      - name: "code-review"
        upstream_path: "skills/engineering/code-review"
        local_path: "skills/code-review"
        patches:
          - "Replace delegation and tracker assumptions with one sequential read-only review."
          - "Require an explicit committed or working diff boundary instead of inferring workflow state."
          - "Add correctness, security, intent, maintainability, finding verification, and strict no-mutation boundaries."
  - repository: "https://github.com/ayghri/i-have-adhd"
    revision: "6f1f982d0a47c65899af3c5a7450b7098bc65325"
    license: "MIT"
    notice: "LICENSE (Third-party notices)"
    skills:
      - name: "focused-output"
        upstream_path: "skills/i-have-adhd"
        local_path: "skills/focused-output"
        patches:
          - "Rename and reframe the skill around an optional focused-output preference without asserting medical traits."
          - "Lead with completed agent-owned work and require user action only when user input or authority is actually needed."
          - "Report changing state instead of repeating it every turn, and give time estimates only when grounded."
          - "Distinguish confirmed error causes from hypotheses and preserve compact completion handoffs."
  - repository: "https://github.com/backnotprop/plannotator"
    revision: "96313ab228ede843203d38d9d2a86e1c87e18c81"
    release: "v0.27.12"
    license: "MIT OR Apache-2.0"
    selected_license: "MIT"
    notice: "LICENSE (Third-party notices)"
    skills:
      - name: "plannotator-review"
        upstream_path: "apps/skills/core/plannotator-review"
        local_path: "skills/plannotator-review"
        patches:
          - "Keep the upstream terminal launch, wait, and returned-feedback behavior."
          - "Accept standalone explicit committed and working diff boundaries."
          - "Hash the complete patch and file manifest before and after review and reject any mismatch."
          - "Keep file, Git, tracker, publication, and cross-skill mutations outside the skill."
