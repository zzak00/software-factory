name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise project configuration
        run: bash test/configure-project.test.sh
      - name: Exercise optional skill installation
        run: bash test/install-skills.test.sh
      - name: Exercise git guardrails
        run: bash test/git-guardrails.test.sh
      - name: Check shell syntax
        run: bash -n scripts/*.sh test/*.sh skills/*/scripts/*.sh
      - name: Install ShellCheck when needed
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh test/*.sh skills/*/scripts/*.sh
