name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run critical tests
        run: npm test
      - name: Check shell syntax
        run: bash -n scripts/*.sh test/*.sh
      - name: Install ShellCheck when needed
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh test/*.sh
